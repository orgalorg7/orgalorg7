<svg xmlns="http://www.w3.org/2000/svg" width="440" height="512" viewBox="0 0 440 512" role="img" aria-labelledby="title desc">
<title id="title">The dark side of the code</title><desc id="desc">Languages by bytes across 5 public repositories: Python 40.6%, Jupyter 29.5%, Rust 15.6%, Assembly 13.7%.</desc>
<style>
  .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Liberation Mono",Consolas,monospace}
  .ray-in{animation:ray-in 1s ease-out .2s forwards}
  @keyframes ray-in{to{stroke-dashoffset:0}}
  .photons{opacity:0;animation:flow 1.1s linear infinite,fade .5s ease-out 1.1s forwards}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes fade{to{opacity:.9}}
  .fade-late{opacity:0;animation:fade-inner .4s ease-out 1.1s forwards}
  @keyframes fade-inner{to{opacity:.22}}
  .shimmer{animation:shimmer 2.8s ease-in-out infinite alternate}
  @keyframes shimmer{from{opacity:.72}to{opacity:1}}
  .pulse{animation:pulse 3.2s ease-in-out infinite alternate}
  @keyframes pulse{from{opacity:.15}to{opacity:.6}}
  .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.4;transform:scale(.6)}to{opacity:1;transform:scale(1.5)}}
  @media (prefers-reduced-motion:reduce){.ray-in,.photons,.fade-late,.shimmer,.pulse,.twinkle{animation:none}.ray-in{stroke-dashoffset:0}.photons{display:none}.fade-late{opacity:.22}}
  @media (prefers-color-scheme: light){svg > [fill="#0d1117"]{fill:#ffffff}svg > [stroke="#0d1117"]{stroke:#ffffff}svg > [fill="#ede8dd"]{fill:#1f2328}svg > [stroke="#ede8dd"]{stroke:#1f2328}svg > [fill="#a4a39e"]{fill:#59636e}svg > [stroke="#a4a39e"]{stroke:#59636e}svg > [fill="#30363d"]{fill:#d1d9e0}svg > [stroke="#30363d"]{stroke:#d1d9e0}svg > [fill="#ee956e"]{fill:#bc4c00}svg > [stroke="#ee956e"]{stroke:#bc4c00}}
</style>
<rect width="440" height="512" rx="8" fill="#0d1117"/>
<path d="M16 1h408" stroke="#30363d"/>
<text x="16" y="34" font-size="13" class="mono" fill="#ee956e" font-weight="400" letter-spacing="1.5" text-anchor="start">05 / SPECTRUM</text>

<text x="14" y="92" font-size="30" class="sans" fill="#ede8dd" font-weight="700" letter-spacing="-1" text-anchor="start">The dark side of the code.</text>
<g transform="translate(16 116)"><rect width="408" height="220" rx="5" fill="#050608"/></g>
<defs>
    <linearGradient id="p-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <filter id="p-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="p-fan"><rect x="212.51135999999997" y="130" width="199.48864000000003" height="192">
      <animate attributeName="width" values="0;0;199.48864000000003" keyTimes="0;.5;1" dur="2.4s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <path d="M38.0 279.8L114.4 233.7" stroke="#f0f6fc" stroke-width="3" stroke-linecap="round" class="ray-in" style="stroke-dasharray:89.2;stroke-dashoffset:89.2"/>
  <path d="M38.0 279.8L114.4 233.7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 22" class="photons"/>
  <path d="M114.4 233.7L212.51135999999997 216.928V228.928Z" fill="#ffffff" opacity=".22" class="fade-late"/>
  <g clip-path="url(#p-fan)">
    <path d="M212.51135999999997 216.9L406 168.4V219.9L212.51135999999997 221.3Z" fill="#e8423f" class="shimmer" style="animation-delay:-0.00s"/>
    <path d="M212.51135999999997 221.3L406 219.9V260.0L212.51135999999997 224.7Z" fill="#f6d743" class="shimmer" style="animation-delay:-0.55s"/>
    <path d="M212.51135999999997 224.7L406 260.0V286.0L212.51135999999997 226.9Z" fill="#4fc263" class="shimmer" style="animation-delay:-1.10s"/>
    <path d="M212.51135999999997 226.9L406 286.0V309.9L212.51135999999997 228.9Z" fill="#8e5bd8" class="shimmer" style="animation-delay:-1.65s"/>
    
    
    
    
  </g>
  <path d="M166.8 149.2L71.6 302.8L262.0 302.8Z" fill="none" stroke="#f0f6fc" stroke-width="5" filter="url(#p-glow)" class="pulse"/>
  <path d="M166.8 149.2L71.6 302.8L262.0 302.8Z" fill="url(#p-glass)" stroke="#f0f6fc" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="212.51135999999997" cy="222.928" r="3" fill="#ffffff" class="twinkle"/>
