<title id="title">Selected projects — Lead Hunter, Rust HTTP server, network labs and data science</title><desc id="desc">Lead Hunter: A persistent CLI for discovering public businesses, assessing websites, and exporting useful lead data. HTTP server in Rust: An HTTP/1.1 server built on standard TCP types, with routing, middleware, streaming, and bounded workers. Network lab: Packet Tracer projects covering company networks, access-control lists, and intrusion-detection scenarios. Data science notebooks: IBM data-science coursework in Jupyter, including a machine-learning prediction lab and historical stock analysis.</desc>
