name: Refresh profile statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh SVG statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Commit changed profile assets
        run: |
          if git diff --quiet -- README.md assets/profile-terminal.svg assets/profile-terminal-mobile.svg; then
            echo "Profile statistics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile-terminal.svg assets/profile-terminal-mobile.svg
          git commit -m "chore: refresh profile statistics"
          git push
